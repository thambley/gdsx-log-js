<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>log to html upload</title>
	<style type="text/css">
		body {
			font-family: sans-serif;
			font-size: 12px;
		}

		#searchdiv {
			float: left;
			margin-right: 10px;
			padding-top: 6px;
			margin-bottom: 10px;
		}

		#pagediv {
			border: 1px solid white;
		}

		#data {
			clear: both;
			overflow: auto;
			width: 100%;
		}

	</style>
	<link href="stylesheets/filter.css" rel="stylesheet" type="text/css" />
	<!--http://www.listjs.com/-->
	<link href="stylesheets/list.css" rel="stylesheet" type="text/css" />
	<script src="javascripts/list.js"></script>
	<script src="javascripts/list.pagination.js"></script>
	<!--http://www.menucool.com/tabbed-content-->
	<link href="stylesheets/tabcontent.css" rel="stylesheet" type="text/css" />
	<script src="javascripts/tabcontent.js" type="text/javascript"></script>
	<!--Travel Leaders Conetent-->
	<script src="../lib/compleat-vendor-debug-parser.js"></script>
</head>

<body>
	<div id="inputdiv" style="width:100%; margin: 0 auto; padding: 0 0 10px;">
		<ul class="tabs" data-persist="true" id="tabslist">
			<li id="tab1">
				<a id="tab1link" href="#copypasteview">Copy/Paste</a>
			</li>
			<li id="tab2">
				<a id="tab2link" href="#uploadview">Upload</a>
			</li>
			<li id="tab3">
				<a id="tab3link" href="#searchview">Search</a>
			</li>
			<li id="tab4">
				<a id="tab4link" href="#filterview">Filter</a>
			</li>
		</ul>
		<div class="tabcontents">
			<div id="copypasteview">
				<form onsubmit="processTextBox();return false;">
					<div id="logdiv">
						<textarea id="logtext" style="width:100%;min-height:75px;max-width:100%;"></textarea>
					</div>
					<div id="upload">
						<input name="submit" id="submit" type="submit" value="Convert" />
					</div>
				</form>
			</div>
			<div id="uploadview" style="display:none;">
				<form>
					<input type="file" id="files" name="files" />
				</form>
			</div>
			<div id="searchview">
				<label for="">Search:</label>
				<input type="text" class="search" placeholder="Search log" id="searchLog" />
			</div>
			<div id="filterview">
				<form id="filter">
					<div class="number_range input optional filter_form_field filter_number_range" id="q_line_number_input">
						<label class="label">Line</label>
						<input size="12" maxlength="10" placeholder="From" value="" type="number" name="q[line_number_gteq]" id="q_line_number_gteq">
						<input size="12" maxlength="10" placeholder="To" value="" type="number" name="q[line_number_lteq]" id="q_line_number_lteq">
					</div>
					<div class="select input optional filter_form_field filter_select" id="q_worker_input">
						<label for="q_worker" class="label">Worker</label>
						<select name="q[worker_eq]" id="q_worker">
							<option value="All">All</option>
						</select>
					</div>
					<div class="buttons">
						<a id="apply_filters_btn" href="#">Apply Filters</a>
						<a id="clear_filters_btn" href="#">Clear Filters</a>
					</div>
				</form>
			</div>
		</div>
	</div>
	<div id="logtable">
		<div id="pagediv">
			<ul class="pagination"></ul>
		</div>
		<div id="data">
			<table class="listable sortable">
				<thead>
					<tr>
						<th class="sort" data-sort="lineNumber">Line</th>
						<th class="sort" data-sort="worker">Worker</th>
						<th class="sort" data-sort="workstation">Workstation</th>
						<th class="sort" data-sort="workflow">Workflow</th>
						<th class="sort" data-sort="process">Process</th>
						<th class="sort" data-sort="routine">Routine</th>
						<th class="sort" data-sort="pnrLocator">Locator</th>
						<th class="sort" data-sort="category">Category</th>
						<th class="sort" data-sort="level">Level</th>
						<th class="sort" data-sort="dateTimeText">Date/Time</th>
						<th class="sort" data-sort="text">Text</th>
					</tr>
				</thead>
				<tbody class="list">
					<tr>
						<td class="lineNumber"></td>
						<td class="worker"></td>
						<td class="workstation"></td>
						<td class="workflow"></td>
						<td class="process"></td>
						<td class="routine"></td>
						<td class="pnrLocator"></td>
						<td class="category"></td>
						<td class="level"></td>
						<td class="dateTimeText"></td>
						<td class="text"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
	<script type="text/javascript">
		//list
		var options = {
			valueNames: ['lineNumber', 'worker', 'workstation', 'category', 'level', 'dateTimeText', 'text', 'workflow',
				'process', 'routine', 'pnrLocator'
			],
			page: 20,
			plugins: [ListPagination({
				outerWindow: 2
			})]
		};
		// Init list
		var logTable = new List('logtable', options);

		// GDSX Log handling
		function processTextBox() {
			processLogText(document.getElementById('logtext').value);
		}

		// utility function to process log text
		function processLogText(logText) {
			if (logText.length > 0) {
				var logArray = compleatVendorDebug.parseLog(logText);
			}
			logTable.clear();
			logTable.add(logArray);
			buildFilters(logArray);
		}

		//http://jsfiddle.net/0GiS0/nDVYd/
		window.onload = function () {
			//Check File API support
			if (window.File && window.FileList && window.FileReader) {
				var filesInput = document.getElementById("files");
				addEvent(filesInput, "change", function (event) {
					var files = event.target.files; //FileList object
					var output = document.getElementById("result");

					for (var i = 0; i < files.length; i++) {
						var file = files[i];
						//Only plain text
						if (!file.type.match('plain') && !file.name.match(/\.log$/)) continue;
						var logReader = new FileReader();
						logReader.addEventListener("load", function (event) {
							var textFile = event.target;
							processLogText(textFile.result);
						});

						//Read the text file
						logReader.readAsText(file);
					}

				});
				addEvent(document.getElementById('tab1link'), 'click', resizeData);
				addEvent(document.getElementById('tab2link'), 'click', resizeData);
				addEvent(document.getElementById('tab3link'), 'click', resizeData);
				addEvent(document.getElementById('tab4link'), 'click', resizeData);
			} else {
				// hide file upload content:
				document.getElementById('tab2').style.display = 'none';
				document.getElementById('tab3').style.display = 'none';
				document.getElementById('tab4').style.display = 'none';
			}
			addEvent(document.getElementById('apply_filters_btn'), 'click', applyFilters);
			addEvent(document.getElementById('clear_filters_btn'), 'click', clearFilters);
			resizeData();
		}

		window.onresize = resizeData;

		function resizeData() {
			window.setTimeout(function () {
				resizeElementHeight(document.getElementById('data'))
			}, 50);
		}

		/** filters **/
		function removeOptions(selectbox) {
			var i;
			for (i = selectbox.options.length - 1; i >= 0; i--) {
				selectbox.remove(i);
			}
		}

		function populateSelect(elementId, values) {
			var selectBox = document.getElementById(elementId);
			removeOptions(selectBox);
			values.unshift('All');

			for (var i = 0; i < values.length; i++) {
				var opt = values[i];
				var el = document.createElement("option");
				el.textContent = opt;
				el.value = opt;
				selectBox.appendChild(el);
			}
		}

		function buildFilters(logTable) {
			let workers = [...new Set(logTable.map(item => item.worker))];
			populateSelect('q_worker', workers.sort());
		}

		function getIntegerValue(elementId) {
			var formVal = document.getElementById(elementId).value;
			if (Number.isNaN(formVal)) {
				return null;
			} else {
				return new Number(formVal).valueOf();
			}
		}

		function selectFilter(elementId) {
			var selectBox = document.getElementById(elementId);
			var value = selectBox.options[selectBox.selectedIndex].value;
			if (value == 'All') {
				return function (val) {
					return true;
				}
			} else {
				return function (val) {
					return (val == value);
				}
			}
		}

		function greaterThanFilter(lowerLimit) {
			return function (val) {
				return (val >= lowerLimit);
			}
		}

		function betweenFilter(lowerLimit, upperLimit) {
			return function (val) {
				return (val >= lowerLimit && val <= upperLimit);
			}
		}

		function applyFilters() {
			var lineFilter;
			var lineGreaterThan = getIntegerValue('q_line_number_gteq');
			var lineLessThan = getIntegerValue('q_line_number_lteq');
			if (lineLessThan <= lineGreaterThan) {
				lineFilter = greaterThanFilter(lineGreaterThan);
			} else {
				lineFilter = betweenFilter(lineGreaterThan, lineLessThan);
			}
			var workerFilter = selectFilter('q_worker');
			logTable.filter(function (item) {
				itemValues = item.values();
				var lineInBounds = lineFilter(itemValues.lineNumber);
				var workerValid = workerFilter(itemValues.worker);
				return lineInBounds && workerValid;
			});
		}

		function clearFilters() {
			document.getElementById('q_line_number_gteq').value = '';
			document.getElementById('q_line_number_lteq').value = '';
			document.getElementById('q_worker').value = 'All';
			logTable.filter();
		}
		/** end filters **/

		//display handling
		//http://stackoverflow.com/questions/33080/setting-the-height-of-a-div-dynamically
		function resizeElementHeight(element) {
			var height = 0;
			var body = window.document.body;
			if (window.innerHeight) {
				height = window.innerHeight;
			} else if (body.parentElement.clientHeight) {
				height = body.parentElement.clientHeight;
			} else if (body && body.clientHeight) {
				height = body.clientHeight;
			}
			element.style.height = (((height - element.offsetTop) - 10) + "px");
		}

		// add event cross browser
		//http://stackoverflow.com/questions/10149963/adding-event-listener-cross-browser
		function addEvent(elem, event, fn) {
			if (elem.addEventListener) {
				elem.addEventListener(event, fn, false);
			} else {
				elem.attachEvent("on" + event, function () {
					// set the this pointer same as addEventListener when fn is called
					return (fn.call(elem, window.event));
				});
			}
		}

	</script>
</body>

</html>
