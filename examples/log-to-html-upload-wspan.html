<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>log to html upload</title>
		<style type="text/css">
			body {
				font-family:sans-serif;
			}
			#searchdiv { 
				float: left;
				margin-right: 10px;
				padding-top: 6px;
				margin-bottom: 10px;
			}
			#pagediv {
				border:1px solid white;
			}
			#data {
				clear:both;
				overflow:auto;
				width: 100%;
			}
		</style>
		<!--http://www.listjs.com/-->
		<link href="stylesheets/list.css" rel="stylesheet" type="text/css" />
		<script src="javascripts/list.js"></script>
		<script src="javascripts/list.pagination.js"></script>
		<!--http://www.menucool.com/tabbed-content-->
		<link href="stylesheets/tabcontent.css" rel="stylesheet" type="text/css" />
		<script src="javascripts/tabcontent.js" type="text/javascript"></script>
		<!--Travel Leaders Conetent-->
		<script src="../lib/compleat-vendor-debug-parser.js"></script>
		<!--http://www.cssscript.com/simple-clean-popup-window-with-pure-javascript-simple-popup/-->
		<!--https://github.com/Alex1990/simple-popup-->
		<link href="stylesheets/simple-popup.css" rel="stylesheet" type="text/css" />
		<script src="javascripts/simple-popup.js" type="text/javascript"></script>
		<!-- syntax highligher -->
		<link href="stylesheets/shCore.css" rel="stylesheet" type="text/css" />
		<link href="stylesheets/shThemeRDark.css" rel="stylesheet" type="text/css" />
		<script src="javascripts/wspan-dir-parser.js"></script>
		<script src="javascripts/xregexp.js"></script>
		<script src="javascripts/shCore.js"></script>
		<script src="javascripts/shBrushXml.js"></script>
	</head>
	<body>
		<div id="inputdiv" style="width:100%; margin: 0 auto; padding: 0 0 10px;">
			<ul class="tabs" data-persist="true" id="tabslist">
				<li id="tab1"><a id="tab1link" href="#view1">Copy/Paste</a></li>
				<li id="tab2"><a id="tab2link" href="#view2">Upload</a></li>
			</ul>
			<div class="tabcontents">
				<div id="view1">
					<form onsubmit="processTextBox();return false;">
						<div id="logdiv">
							<textarea id="logtext" style="width:100%;min-height:75px;max-width:100%;"></textarea>
						</div>
						<div id="buttondiv">
							<input name="submit" id="submit" type="submit" value="Convert" />
						</div>
					</form>
				</div>
				<div id="view2" style="display:none;">
					<form>
						<input type="file" id="files" name="files" />
					</form>
				</div>
			</div>
		</div>
		<div id="logtable">
			<div id="searchdiv"><label for="">Search:</label> <input type="text" class="search" placeholder="Search log" id="searchLog" /></div>
			<div id="pagediv"><ul class="pagination"></ul></div>
			<div id="data">
				<table class="listable sortable">
					<thead>
						  <tr>
								<th class="sort" data-sort="lineNumber">Line</th>
								<th class="sort" data-sort="worker">Worker</th>
								<th class="sort" data-sort="workstation">Workstation</th>
								<th class="sort" data-sort="workflow">Workflow</th>
								<th class="sort" data-sort="process">Process</th>
								<th class="sort" data-sort="routine">Routine</th>
								<th class="sort" data-sort="pnrLocator">Locator</th>
								<th class="sort" data-sort="category">Category</th>
								<th class="sort" data-sort="level">Level</th>
								<th class="sort" data-sort="dateTimeText">Date/Time</th>
								<th class="sort" data-sort="text">Text</th>
						  </tr>
					</thead>
					<tbody class="list">
						<tr>
							<td class="lineNumber"></td>
							<td class="worker"></td>
							<td class="workstation"></td>
							<td class="workflow"></td>
							<td class="process"></td>
							<td class="routine"></td>
							<td class="pnrLocator"></td>
							<td class="category"></td>
							<td class="level"></td>
							<td class="dateTimeText"></td>
							<td class="text"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div id="popup" class="popup-wrapper popup-hide">
		  <div class="popup-content">
			<div class="popup-title">
			  <button type="button" class="popup-close">&times;</button>
			  <h3>DIR to XML</h3>
			</div>
			<div id="popup-body" class="popup-body"></div>
		  </div>
		</div>
		<script type="text/javascript">
			//list
			var options = {
			  valueNames: [ 'lineNumber', 'worker','workstation','category', 'level', 'dateTimeText', 'text', 'workflow', 'process', 'routine', 'pnrLocator' ],
			  plugins: [ ListPagination({outerWindow:2}) ] 
			};
			// Init list
			var logTable = new List('logtable', options);
			
			// GDSX Log handling
			function processTextBox() {
				processLogText(document.getElementById('logtext').value);
			}
			
			// utility function to process log text
			function processLogText(logText) {
				if (logText.length > 0) {
					var logArray = compleatVendorDebug.parseLog(logText);
				}
				logTable.clear();
				logTable.add(logArray);
			}
			
			//http://jsfiddle.net/0GiS0/nDVYd/
			window.onload = function() {
				//Check File API support
				if (window.File && window.FileList && window.FileReader) {
					var filesInput = document.getElementById("files");
					addEvent(filesInput,"change", function(event) {
						var files = event.target.files; //FileList object
						var output = document.getElementById("result");

						for (var i = 0; i < files.length; i++) {
							var file = files[i];
							//Only plain text
							if (!file.type.match('plain') && !file.name.match(/\.log$/)) continue;
							var logReader = new FileReader();
							logReader.addEventListener("load", function(event) {
								var textFile = event.target;
								processLogText(textFile.result);
							});

							//Read the text file
							logReader.readAsText(file);
						}

					});
					addEvent(document.getElementById('tab1link'),'click',resizeData);
					addEvent(document.getElementById('tab2link'),'click',resizeData);
				} else {
					// hide file upload content:
					document.getElementById('tab2').style.display = 'none';
				}
				resizeData();
			}
			
			window.onresize = resizeData;
			
			function resizeData() {
				window.setTimeout(function() {resizeElementHeight(document.getElementById('data'))}, 50);
			}
			
			//display handling
			//http://stackoverflow.com/questions/33080/setting-the-height-of-a-div-dynamically
			function resizeElementHeight(element) {
				var height = 0;
				var body = window.document.body;
				if (window.innerHeight) {
					height = window.innerHeight;
				} else if (body.parentElement.clientHeight) {
					height = body.parentElement.clientHeight;
				} else if (body && body.clientHeight) {
					height = body.clientHeight;
				}
				element.style.height = (((height - element.offsetTop) - 10) + "px");
			}
			
			// add event cross browser
			//http://stackoverflow.com/questions/10149963/adding-event-listener-cross-browser
			function addEvent(elem, event, fn) {
				if (elem.addEventListener) {
					elem.addEventListener(event, fn, false);
				} else {
					elem.attachEvent("on" + event, function() {
						// set the this pointer same as addEventListener when fn is called
						return(fn.call(elem, window.event));   
					});
				}
			}
			
			var popupEl = document.getElementById('popup');
			var popup = new Popup(popupEl, {
				width: 600,
				height: 400
			});
			
			xmlBrush = new SyntaxHighlighter.brushes.Xml();
			xmlBrush.init({ toolbar: false, 'class-name':'xml' });
			function convertDIR(DIRText) {
				if (DIRText.length > 0) {
					//DIR0DPN0000003720011P1P0001P1PQL00000001010101000000000000000102908370$00000000000144PNRQ3279P211 2ZOBAW.Y2FS11A*232O3219P15AACTNP14AATXP13AXSP14ACNVP14ACPYP15ADISCP14AEDTP14AEORP14AEOVP13AUSP14AFOPP18AFQA.4*QP13AFRP13AFTP13AGAP13AHAP13AIAP15AIRRMP13ANAP13AOAP14AOTSP13APAP15APCHRP15APCTCP14APTSP13ARAP15ARTNGP13ASAP14ASURP12ATP13ATLP13ATF0.125ROPTS2174IRRM11Y4LINE11Y00
				
					var DIRTree = wspanDIR.parseDIRMessage(DIRText);
					//var stringPre = document.createElement('pre');
					//stringPre.appendChild(document.createTextNode(DIRTree.toString()));
					var outputNode = document.getElementById("popup-body");
					//outputNode.replaceChild(stringPre, outputNode.firstChild);
					var plainXML = DIRTree.toXML();
					var prettyXML = xmlBrush.getHtml(plainXML);
					
					//var xmlPre = document.createElement('pre');
					//xmlPre.appendChild(document.createTextNode(plainXML));
					//outputNode.replaceChild(xmlPre, outputNode.lastChild);
					outputNode.innerHTML = prettyXML;
				}
			}
			
			function hasClass(el, cls) {
				if (!el.className) {
					return false;
				} else {
					var newElementClass = ' ' + el.className + ' ';
					var newClassName = ' ' + cls + ' ';
					return newElementClass.indexOf(newClassName) !== -1;
				}
			}
			
			function showPopUp(e) {
				e = e || window.event;
				var targ = e.target || e.srcElement;
				if (targ.nodeType == 3) targ = targ.parentNode; // defeat Safari bug
				if (targ.tagName.toUpperCase() === 'TD') {
					if (hasClass(targ, 'text') && (targ.textContent.length > 3) && (targ.textContent.substring(0,3) === 'DIR')) {
						convertDIR(targ.textContent);
						highlightPopupCell(targ);
						popup.open();
						window.setTimeout(resizePopupBody, 50);
					}
				}
			}
			
			function resizePopupBody() {
				var popupBody = document.getElementById('popup-body');
				var popup = document.getElementById('popup');
				popupHeight = popup.offsetHeight || popup.clientHeight;
				var distance = 0;
				var element = popupBody;
				if (element.offsetParent) {
					do {
						distance += element.offsetTop;
						element = element.offsetParent;
					} while (element && (element != popup));
				}
				var bottomMargin = 30;
				var newHeight = (popupHeight - distance - bottomMargin).toString() + 'px';
				popupBody.style.height = newHeight;
			}
			
			addEvent(document.getElementById('logtable'), 'click', showPopUp);
			
			var popupCell;
			
			function highlightPopupCell(newCell) {
				if (popupCell) {
					popupCell.style.color = newCell.style.color;
				}
				popupCell = newCell;
				popupCell.style.color = 'blue';
			}

		</script>
	</body>
</html>
